<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>Registracija</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="card-title text-center mb-4">Registracija</h3>

                    <div id="errorMsg" class="alert alert-danger d-none"></div>
                    <div id="successMsg" class="alert alert-success d-none"></div>

                    <div class="mb-3">
                        <label class="form-label">Ime</label>
                        <input type="text" id="ime" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Prezime</label>
                        <input type="text" id="prezime" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" id="email" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Lozinka</label>
                        <input type="password" id="lozinka" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Datum rođenja</label>
                        <input type="date" id="datumRodjenja" class="form-control">
                    </div>

                    <button onclick="registracija()" class="btn btn-success w-100">Registruj se</button>

                    <p class="text-center mt-3">
                        Već imate nalog? <a href="/login.html">Prijavite se</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script>
    async function registracija() {
        const body = {
            ime: document.getElementById('ime').value,
            prezime: document.getElementById('prezime').value,
            email: document.getElementById('email').value,
            lozinka: document.getElementById('lozinka').value,
            datumRodjenja: document.getElementById('datumRodjenja').value
        };

        const res = await api.post('/korisnici/registracija', body);

        if (res.ok) {

            const successDiv = document.getElementById('successMsg');
            successDiv.classList.remove('d-none');
            successDiv.textContent = 'Uspešno ste se registrovali! Preusmeravamo vas na prijavu...';

            setTimeout(() => {
                window.location.href = '/login.html';
            }, 2000);
        } else {
            const greska = await res.text();
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.classList.remove('d-none');
            errorDiv.textContent = greska;
        }
    }
</script>

</body>
</html>
